name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  HUSKY: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          # cache 옵션 제거 — corrupt cache 가 npm ci hang 원인이었음.

      - name: Install dependencies
        # Real root cause (finally diagnosed): package-lock.json 에 49개 private
        # a private mirror registry URL 이 박혀 있어 GitHub runner 가 fetch 시
        # 8분 hang. lock 의 모든 URL 을 registry.npmjs.org 로 교체 + project-local
        # .npmrc 로 public registry 강제. (IMPROVEMENTS.md #21 진정한 fix)
        run: npm ci --no-audit --fetch-timeout=120000 --fetch-retries=3
        timeout-minutes: 5

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run lint:types

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7
