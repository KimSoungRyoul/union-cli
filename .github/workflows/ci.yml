name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  HUSKY: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show npm/node version
        run: node --version && npm --version

      - name: Install dependencies (verbose)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline=false 2>&1 | tail -50
        timeout-minutes: 5

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run lint:types

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
