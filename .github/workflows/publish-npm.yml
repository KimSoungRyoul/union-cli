name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

# npm Trusted Publishing (OIDC)
#  - npm CLI 11.5.1+ & Node 22.14.0+ 필요 (setup-node@v6 + node 22로 충족)
#  - --provenance 플래그 불필요: trusted publishing이면 npm이 자동 첨부
#  - id-token: write 권한이 OIDC 토큰 발급을 허용
#
#  사전 설정 (1회):
#    1. 최초 publish는 trusted publisher 등록 전이므로 로컬에서
#       `npm publish --access public` 1회 실행 (시드 publish)
#    2. https://www.npmjs.com/package/<pkg>/access 에서
#       "Trusted Publisher" 추가 → GitHub Actions 선택
#       - Organization or user: KimSoungRyoul
#       - Repository: union-cli
#       - Workflow filename: publish-npm.yml
#       - Environment name: (비워둠)
#    3. create-union-cli 패키지에도 동일하게 등록

permissions:
  contents: read
  id-token: write

env:
  HUSKY: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version on workspaces
        run: |
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --workspace=packages/create-union-cli

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish union-cli (OIDC, provenance auto-attached)
        run: npm publish --access public

      - name: Publish create-union-cli (OIDC, provenance auto-attached)
        working-directory: packages/create-union-cli
        run: npm publish --access public
